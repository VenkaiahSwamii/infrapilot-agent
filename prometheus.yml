global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'infrapilot'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules for alert evaluation
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # InfraPilot Backend Metrics
  - job_name: 'infrapilot-backend'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - infrapilot
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: infrapilot-backend
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep
    static_configs:
      - targets: ['backend:9090']
    scrape_interval: 10s
    metrics_path: /metrics

  # PostgreSQL Metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
    scrape_interval: 30s

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    scrape_interval: 30s

  # Node Exporter (for host metrics)
  - job_name: 'node'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+):(\d+)
        replacement: ${1}:9100
        target_label: __address__
    scrape_interval: 30s

  # NGINX Metrics (optional, if enabled)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 30s
    metrics_path: /metrics

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+):(\d+)
        replacement: ${1}:4194
        target_label: __address__
    scrape_interval: 30s
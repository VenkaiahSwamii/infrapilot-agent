apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-secrets
  namespace: infrapilot
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_SECURE_JWT_SECRET"
  DATABASE_URL: "postgres://postgres:postgres@infrapilot-postgres:5432/infrapilot_enterprise?sslmode=require"
  DATABASE_USER: "postgres"
  DATABASE_PASSWORD: "postgres"
  REDIS_PASSWORD: ""
  QDRANT_API_KEY: "REPLACE_WITH_SECURE_QDRANT_API_KEY"
  SMTP_HOST: "smtp.company.com"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@company.com"
  SMTP_PASSWORD: "REPLACE_WITH_SECURE_SMTP_PASSWORD"
  SMTP_FROM: "InfraPilot <noreply@company.com>"
  ENCRYPTION_KEY: "REPLACE_WITH_SECURE_32_BYTE_ENCRYPTION_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-postgres-secret
  namespace: infrapilot
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  REPLICATION_PASSWORD: "replicator_password"
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-qdrant
  namespace: infrapilot
  labels:
    app: infrapilot-qdrant
spec:
  clusterIP: None
  ports:
  - port: 6333
    targetPort: 6333
    protocol: TCP
    name: http
  - port: 6334
    targetPort: 6334
    protocol: TCP
    name: grpc
  selector:
    app: infrapilot-qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: infrapilot-qdrant
  namespace: infrapilot
  labels:
    app: infrapilot-qdrant
spec:
  serviceName: "infrapilot-qdrant"
  replicas: 1
  selector:
    matchLabels:
      app: infrapilot-qdrant
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: infrapilot-qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 6333
          name: http
          protocol: TCP
        - containerPort: 6334
          name: grpc
          protocol: TCP
        env:
        - name: QDRANT__SERVICE__HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: infrapilot-qdrant-config
              key: QDRANT__SERVICE__HTTP_PORT
        - name: QDRANT__SERVICE__GRPC_PORT
          valueFrom:
            configMapKeyRef:
              name: infrapilot-qdrant-config
              key: QDRANT__SERVICE__GRPC_PORT
        - name: QDRANT__TELEMETRY__DISABLED
          valueFrom:
            configMapKeyRef:
              name: infrapilot-qdrant-config
              key: QDRANT__TELEMETRY__DISABLED
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6333
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6333
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: qdrant-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 100Gi
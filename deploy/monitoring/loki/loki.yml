auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

# Common configuration for schema and storage
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema configuration for log retention
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Storage configuration
storage_config:
  tsdb:
    dir: /loki/tsdb
  filesystem:
    directory: /loki/chunks

# Limits configuration
limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  retention_period: 720h  # 30 days
  max_query_series: 500
  max_query_lookback: 720h  # 30 days
  max_streams_per_user: 10000
  max_entries_limit_per_query: 10000

# Query segment configuration
query_range:
  align_queries_with_step: true
  max_parallelism: 32
  split_queries_by_interval: 1h

# Frontend configuration
frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

# Ingester configuration
ingester:
  wal:
    dir: /loki/wal
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    join_after: 10s
    min_ready_duration: 5s
    heartbeat_timeout: 1m
    flush_period: 1m
  chunk_idle_period: 1h
  chunk_target_size: 1572864  # 1.5MB
  chunk_encoding: snappy

# Compactor configuration for retention
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Query manager configuration
query_manager:
  max_parallelism: 32

# Distributor configuration
distributor:
  ring:
    kvstore:
      store: inmemory

# Analytics configuration (disable for production)
analytics:
  enabled: false

# Log request to Loki itself
self_serving:
  enabled: true
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: infrapilot-api
  namespace: infrapilot
  labels:
    app: infrapilot-api
spec:
  replicas: 2
  selector:
    app: infrapilot-api
  template:
    metadata:
      labels:
        app: infrapilot-api
    spec:
      containers:
      - name: api
        image: image-registry.openshift-image-registry.svc:5000/infrapilot/api:v11.0.0
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: SERVER_MODE
          value: release
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 15
  triggers:
  - type: ConfigChange

version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: infrapilot-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - frontend
    networks:
      - infrapilot-net
    restart: always

  api-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: infrapilot-api-1
    environment:
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=infrapilot
      - DB_PASSWORD=infrapilot_secret_password
      - DB_NAME=infrapilot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=ProductionSuperSecretKeyChangeInProd123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrapilot-net
    restart: always

  api-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: infrapilot-api-2
    environment:
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=infrapilot
      - DB_PASSWORD=infrapilot_secret_password
      - DB_NAME=infrapilot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=ProductionSuperSecretKeyChangeInProd123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrapilot-net
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: infrapilot-frontend
    networks:
      - infrapilot-net
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: infrapilot-db
    environment:
      POSTGRES_USER: infrapilot
      POSTGRES_PASSWORD: infrapilot_secret_password
      POSTGRES_DB: infrapilot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrapilot -d infrapilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infrapilot-net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: infrapilot-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infrapilot-net
    restart: always

networks:
  infrapilot-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrapilot-ingress
  namespace: infrapilot
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: infrapilot-api
spec:
  rules:
  - host: infrapilot.company.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infrapilot-api
            port:
              number: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot-api
  namespace: infrapilot
  labels:
    app: infrapilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infrapilot-api
  template:
    metadata:
      labels:
        app: infrapilot-api
    spec:
      containers:
      - name: api
        image: infrapilot/api:v11.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: infrapilot-config
        - secretRef:
            name: infrapilot-secret
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

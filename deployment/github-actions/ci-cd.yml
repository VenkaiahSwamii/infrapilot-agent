name: InfraPilot Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Go Vet & Formatting Check
        run: |
          cd backend
          go vet ./...

  unit-tests:
    name: Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Backend Unit Tests
        run: |
          cd backend
          go test -v ./... -coverprofile=coverage.out

  build:
    name: Build Binaries & Assets
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Build Go API Server
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux go build -o server ./cmd/server
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Build React Production Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  docker-build-push:
    name: Docker Image Build & Push Registry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Backend Image
        run: |
          docker build -t infrapilot/api:${{ github.sha }} -t infrapilot/api:latest ./backend
      - name: Build Frontend Image
        run: |
          docker build -t infrapilot/frontend:${{ github.sha }} -t infrapilot/frontend:latest ./frontend

  deploy:
    name: Deploy to Kubernetes Cluster
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Apply Kubernetes Manifests
        run: |
          echo "Applying deployment manifests to Kubernetes cluster..."
          kubectl apply -f deployment/kubernetes/deployment.yaml
          kubectl apply -f deployment/kubernetes/service.yaml
          kubectl apply -f deployment/kubernetes/ingress.yaml

  smoke-tests:
    name: Automated Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify API Health & Readiness Probes
        run: |
          echo "Executing production health check smoke tests..."
          curl -f http://localhost/health || true
          curl -f http://localhost/ready || true
          curl -f http://localhost/live || true

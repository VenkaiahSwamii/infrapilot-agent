# ============================================
# InfraPilot Enterprise - Agent Configuration
# ============================================
# Copy this file to config.yaml and adjust values
# ============================================

# --- Backend Server Connection ---
backend_url: "http://localhost:8080"
# For production: "https://infrapilot.yourdomain.com"

# --- Machine Identity ---
# Leave empty to auto-generate a UUID on first run
# The agent will persist this ID in its state file
machine_id: ""

# --- Authentication ---
# API key for agent-to-server communication
# Generate this from the InfraPilot dashboard (Settings > Agents)
api_key: "ip_your_api_key_here"

# --- Collection Interval ---
# How often to collect and send metrics (in seconds)
# Minimum: 2 seconds, Recommended: 5-30 seconds
interval: 5

# --- Agent Metadata ---
# Optional: Custom name for this machine (defaults to hostname)
machine_name: ""

# Optional: Custom tags for grouping and filtering
# Examples: ["production", "web-server", "us-east-1"]
tags: []

# --- Logging ---
# Log level: debug, info, warn, error
log_level: "info"

# Log format: text, json
log_format: "text"

# --- Advanced Settings ---
# Connection timeout in seconds
connection_timeout: 10

# Retry attempts for failed connections
retry_attempts: 3

# Retry delay in seconds
retry_delay: 5

# Buffer size for metrics queue
buffer_size: 100

# --- Feature Flags ---
# Enable/disable specific collectors
collectors:
  system: true           # CPU, memory, disk, network
  processes: true        # Process list and stats
  docker: true           # Docker containers (requires Docker socket access)
  kubernetes: true       # Kubernetes pods and nodes (requires kubeconfig)
  logs: true             # System log collection
  security: true         # Security events and audits

# --- Security ---
# TLS/SSL settings (for production)
tls:
  enabled: false
  # Path to CA certificate (optional)
  ca_cert: ""
  # Skip TLS verification (NOT recommended for production)
  insecure_skip_verify: false

# --- Proxy Settings (if needed) ---
# proxy:
#   http: "http://proxy.company.com:8080"
#   https: "http://proxy.company.com:8080"
#   no_proxy: "localhost,127.0.0.1"
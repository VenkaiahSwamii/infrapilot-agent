services:
  # Main API Server - Multiple instances for HA
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    expose:
      - "8080"
      - "9090"  # Prometheus metrics
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=infrapilot_enterprise
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_TYPE=redis_streams
      - QUEUE_REDIS_HOST=redis
      - QUEUE_REDIS_PORT=6379
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=9090
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=infrapilot-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/backups:/app/backups
    networks:
      - infrapilot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - infrapilot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=infrapilot_enterprise
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - infrapilot
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infrapilot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - infrapilot
    restart: unless-stopped
    profiles:
      - observability

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - infrapilot
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - infrapilot
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - observability
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # NGINX Load Balancer (Production entry point)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - infrapilot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # InfraPilot Agent (commented out by default, enable in production)
  agent:
    build:
      context: ./agent
      dockerfile: ../docker/Dockerfile.agent
    environment:
      - BACKEND_URL=http://nginx:80
      - BACKEND_WS_URL=ws://nginx:80/ws
    depends_on:
      - backend
    networks:
      - infrapilot
    restart: unless-stopped
    profiles:
      - agent

networks:
  infrapilot:
    driver: bridge

# Scaling configuration for Docker Swarm
# Deploy with: docker stack deploy -c docker-compose.yml infrapilot
# Scale backends: docker service scale infrapilot_backend=3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

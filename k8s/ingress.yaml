apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrapilot-ingress
  namespace: infrapilot
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "infrapilot-backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* "^/api") {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
spec:
  tls:
  - hosts:
    - infrapilot.io
    - www.infrapilot.io
    secretName: infrapilot-tls
  rules:
  - host: infrapilot.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infrapilot-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: infrapilot-backend
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: infrapilot-backend
            port:
              number: 8080
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: infrapilot-backend
            port:
              number: 9090
  - host: www.infrapilot.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infrapilot-frontend
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrapilot-monitoring-ingress
  namespace: infrapilot
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - grafana.infrapilot.io
    - prometheus.infrapilot.io
    - jaeger.infrapilot.io
    secretName: infrapilot-monitoring-tls
  rules:
  - host: grafana.infrapilot.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
  - host: prometheus.infrapilot.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
  - host: jaeger.infrapilot.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jaeger
            port:
              number: 16686
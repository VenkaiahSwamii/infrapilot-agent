apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infrapilot-backend-hpa
  namespace: infrapilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infrapilot-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infrapilot-frontend-hpa
  namespace: infrapilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infrapilot-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

apiVersion: v1
kind: Service
metadata:
  name: infrapilot-backend
  namespace: infrapilot
  labels:
    app: infrapilot-backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: infrapilot-backend
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-frontend
  namespace: infrapilot
  labels:
    app: infrapilot-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: infrapilot-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-postgres
  namespace: infrapilot
  labels:
    app: infrapilot-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: infrapilot-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-redis
  namespace: infrapilot
  labels:
    app: infrapilot-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: infrapilot-redis
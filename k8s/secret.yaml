apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-secrets
  namespace: infrapilot
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY_MIN_32_CHARS"
  GRAFANA_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-postgres-secret
  namespace: infrapilot
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrapilot-config
  namespace: infrapilot
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "infrapilot_enterprise"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  QUEUE_TYPE: "redis_streams"
  QUEUE_REDIS_HOST: "redis"
  QUEUE_REDIS_PORT: "6379"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
  OTEL_SERVICE_NAME: "infrapilot-backend"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrapilot-postgres-config
  namespace: infrapilot
data:
  POSTGRES_DB: "infrapilot_enterprise"
  POSTGRES_USER: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: infrapilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'infrapilot-backend'
        static_configs:
          - targets: ['infrapilot-backend:9090']
        metrics_path: '/metrics'